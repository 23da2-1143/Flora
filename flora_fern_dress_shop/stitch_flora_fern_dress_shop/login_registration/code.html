<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;500;700;800&amp;family=Manrope:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-tertiary-fixed": "#261900",
                    "surface-container-high": "#e9e8e5",
                    "surface-bright": "#faf9f6",
                    "tertiary": "#775a19",
                    "outline-variant": "#d4c2c2",
                    "primary": "#7b5455",
                    "on-surface-variant": "#504444",
                    "surface-container": "#efeeeb",
                    "secondary-container": "#f2e0cc",
                    "tertiary-fixed": "#ffdea5",
                    "on-error": "#ffffff",
                    "secondary-fixed": "#f2e0cc",
                    "inverse-primary": "#ecbbba",
                    "on-tertiary": "#ffffff",
                    "on-error-container": "#93000a",
                    "on-secondary-container": "#706253",
                    "tertiary-fixed-dim": "#e9c176",
                    "secondary-fixed-dim": "#d5c4b1",
                    "surface-container-lowest": "#ffffff",
                    "on-secondary": "#ffffff",
                    "surface-container-highest": "#e3e2e0",
                    "primary-fixed": "#ffdad9",
                    "on-secondary-fixed": "#231a0e",
                    "primary-fixed-dim": "#ecbbba",
                    "on-primary-container": "#5d3a3b",
                    "error-container": "#ffdad6",
                    "surface-tint": "#7b5455",
                    "inverse-on-surface": "#f2f1ee",
                    "inverse-surface": "#2f312f",
                    "on-primary-fixed": "#2f1314",
                    "tertiary-container": "#d1ab63",
                    "on-tertiary-fixed-variant": "#5d4201",
                    "on-primary": "#ffffff",
                    "error": "#ba1a1a",
                    "background": "#faf9f6",
                    "outline": "#827473",
                    "on-primary-fixed-variant": "#603d3e",
                    "surface-variant": "#e3e2e0",
                    "on-surface": "#1a1c1a",
                    "on-secondary-fixed-variant": "#514537",
                    "surface-dim": "#dbdad7",
                    "secondary": "#695c4d",
                    "surface-container-low": "#f4f3f1",
                    "primary-container": "#d4a5a5",
                    "surface": "#faf9f6",
                    "on-tertiary-container": "#593f00",
                    "on-background": "#1a1c1a"
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem"
            },
            "fontFamily": {
                    "headline": ["Epilogue"],
                    "body": ["Manrope"],
                    "label": ["Manrope"]
            }
          },
        },
      }
    </script>
<style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
      }
      .glass-panel {
        background: rgba(250, 249, 246, 0.75);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
      }
      .gold-shimmer {
        background: linear-gradient(135deg, #775a19 0%, #d1ab63 50%, #775a19 100%);
      }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body min-h-screen flex flex-col items-center justify-center relative overflow-x-hidden">
<!-- Background Image Layer -->
<div class="fixed inset-0 z-0">
<img alt="" class="w-full h-full object-cover" data-alt="elegant woman in a flowing soft pink silk dress standing in a sun-drenched minimalist atelier with warm golden hour light" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAXJ6Rz0KRvWwBo1yvFDX840_zNRzMlyvF-09XFjtIEoJFDg8dIB4BfJnE9z3zIF943lYE4Z7ZSyPiE5ORKXw08bQ93F7QYa6K4T574TTxQyVQx5vDFuwWHTzbJTAbWNuQKkS9S3M2KnNcnZe3-_MDtcDXP4ymTuyKdIlrTpMXQq4-V-aesULGRzUXNg6znmAs6n3850NQCMx24YUdiovXfuOKPfG3wIzjkWI3Ns3h69AT6X5xS-ZBoFPjWLAC_d7_-vQ_ofZ0c1VZW"/>
<div class="absolute inset-0 bg-black/10"></div>
</div>
<!-- Main Content Shell (No Shell Visibility Rule: Login page excludes TopAppBar and BottomNavBar) -->
<main class="relative z-10 w-full max-w-md px-6 py-12 md:py-24">
<div class="glass-panel p-8 md:p-12 rounded-xl shadow-[0_12px_40px_rgba(26,28,26,0.06)] flex flex-col">
<!-- Branding -->
<div class="mb-12 text-center">
<h1 class="font-headline font-extrabold text-3xl tracking-tighter text-on-surface mb-2">Flora &amp; Fern</h1>
<p class="font-label text-xs uppercase tracking-[0.2em] text-on-surface-variant/80">The Digital Atelier</p>
</div>
<!-- Header -->
<div class="mb-10">
<h2 class="font-headline text-2xl font-bold text-on-surface mb-2">Welcome Back</h2>
<p class="text-on-surface-variant text-sm font-medium">Log in to your curated wardrobe experience.</p>
</div>
<!-- Login Form -->
<form class="space-y-8" onsubmit="return false;">
<!-- Email Field -->
<div class="relative group">
<label class="font-label text-[10px] uppercase tracking-widest text-on-surface-variant absolute -top-2 left-0" for="email">Email Address</label>
<input class="w-full bg-transparent border-0 border-b border-outline-variant/30 py-3 px-0 focus:ring-0 focus:border-primary transition-colors text-on-surface placeholder:text-on-surface-variant/30 font-medium" id="email" name="email" placeholder="sophia@atelier.com" type="email"/>
</div>
<!-- Password Field -->
<div class="relative group">
<label class="font-label text-[10px] uppercase tracking-widest text-on-surface-variant absolute -top-2 left-0" for="password">Password</label>
<input class="w-full bg-transparent border-0 border-b border-outline-variant/30 py-3 px-0 focus:ring-0 focus:border-primary transition-colors text-on-surface placeholder:text-on-surface-variant/30 font-medium" id="password" name="password" placeholder="••••••••" type="password"/>
<button class="absolute right-0 top-3 text-on-surface-variant/60 hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
<!-- Forgot & Submit -->
<div class="flex flex-col space-y-6 pt-2">
<div class="flex justify-end">
<a class="text-xs font-label uppercase tracking-wider text-primary hover:text-on-primary-container transition-colors" href="#">Forgot Password?</a>
</div>
<button class="w-full bg-primary text-on-primary py-4 font-headline font-bold uppercase tracking-widest text-sm hover:opacity-90 transition-all rounded-sm" type="submit">
                        Enter the Atelier
                    </button>
</div>
</form>
<!-- Divider -->
<div class="relative my-10">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant/15"></div>
</div>
<div class="relative flex justify-center text-xs">
<span class="px-4 glass-panel text-on-surface-variant/60 font-label uppercase tracking-widest">Or Continue With</span>
</div>
</div>
<!-- Social Logins -->
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center py-3 px-4 rounded-full bg-surface-container-lowest border border-outline-variant/10 hover:bg-surface-container transition-colors">
<img class="w-4 h-4 mr-2" data-alt="google icon logo" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAAX7cJCwD7e6YCIg0E4KPIsYlOENU64S2_47DgLj-yCrro0-ceoksTOes5brX_CS17iIkbHQX15sPzfMOBU-AjyFHcT8lWoFQ5lLgPAyc8Wi4f0JF3o67c0LyKua3TydZjgxRI3JMEes3v5EWKf9hyoDJqjItN1GIIM2NHKtLQKOJBPbCPhw8OZHqq2oYiPpUC4xHCGcoTHegS-qOlrKK103tDTO4LX6W2TryULkHfbVWAon8z5vOPqOAr3q0Hk-rIBMmOYjc2ivyp"/>
<span class="text-xs font-bold tracking-tight text-on-surface">Google</span>
</button>
<button class="flex items-center justify-center py-3 px-4 rounded-full bg-on-surface text-surface-container-lowest hover:opacity-90 transition-colors">
<span class="material-symbols-outlined text-[18px] mr-2" style="font-variation-settings: 'FILL' 1;">ios</span>
<span class="text-xs font-bold tracking-tight">Apple</span>
</button>
</div>
<!-- Footer Link -->
<div class="mt-12 text-center">
<p class="text-sm text-on-surface-variant font-medium">
                    New to Flora &amp; Fern? 
                    <a class="text-primary font-bold ml-1 hover:underline underline-offset-4 decoration-outline-variant" href="#">Create Account</a>
</p>
</div>
</div>
<!-- Gold Accent Tag (Atelier Badge) -->
<div class="mt-8 flex justify-center">
<div class="gold-shimmer px-6 py-2 rounded-full flex items-center shadow-lg">
<span class="material-symbols-outlined text-white text-[16px] mr-2" style="font-variation-settings: 'FILL' 1;">verified</span>
<span class="font-label text-[10px] uppercase tracking-[0.2em] text-white font-bold">Authenticated Luxury Experience</span>
</div>
</div>
</main>
<!-- Support Floating UI -->
<div class="fixed bottom-8 right-8 z-20">
<button class="w-12 h-12 glass-panel rounded-full flex items-center justify-center text-primary shadow-xl border border-white/20 hover:scale-105 transition-transform">
<span class="material-symbols-outlined">help_outline</span>
</button>
</div>
</body></html>
